<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏝️ 무인도에서 살아남기 · 건강권 AAAQ 어드벤처</title>
  <meta name="description" content="중학교 보건수업 건강권(AAAQ) 탐정단 무인도 생존 어드벤처 게임 및 교사용 대시보드">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Floating Island Environment Background Props -->
  <div class="game-bg-decorations">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="island-prop prop-palm-left">🌴</div>
    <div class="island-prop prop-palm-right">🌴</div>
    <div class="island-prop prop-volcano">🌋</div>
    <div class="island-prop prop-ship">⛵</div>
  </div>

  <!-- Game Top Navigation Header -->
  <header class="game-top-bar">
    <div class="game-nav-container">
      <div class="game-logo">
        <span class="compass-icon">🧭</span>
        <div>
          <h1>무인도 생존 어드벤처</h1>
          <span>건강권 AAAQ 탐정단 미션</span>
        </div>
      </div>

      <!-- Quest Stage Chips -->
      <nav class="quest-step-bar" aria-label="탐험 단계">
        <button class="quest-chip active" data-step="1">🚩 1. 탐정단 결성</button>
        <button class="quest-chip" data-step="2">📦 2. 생존템 공개</button>
        <button class="quest-chip" data-step="3">🎒 3. 모둠별 장착</button>
        <button class="quest-chip" data-step="4">⚡ 4. 재난 배틀</button>
        <button class="quest-chip" data-step="5">🏆 5. 최종 탈출</button>
      </nav>

      <!-- Quick Game Utility Controls -->
      <div style="display: flex; gap: 8px; align-items: center;">
        <button id="btnSoundToggle" class="game-btn" style="padding: 6px 14px; font-size: 0.95rem;">🔊 효과음 켬</button>
        <button id="btnFullscreen" class="game-btn" style="padding: 6px 14px; font-size: 0.95rem;">⛶ 전체화면</button>
        <button id="btnResetAll" class="game-btn game-btn-danger" style="padding: 6px 14px; font-size: 0.95rem;">↺ 리셋</button>
      </div>
    </div>
  </header>

  <!-- Main Game Stage -->
  <main class="game-main-stage">
    <!-- Step 1: 탐정단 결성 (모둠 설정) -->
    <section id="stepSection1" class="view-section active"></section>

    <!-- Step 2: 생존템 공개 (8가지 건강권 카드) -->
    <section id="stepSection2" class="view-section"></section>

    <!-- Step 3: 모둠별 장착 현황 (교사용 대시보드 인벤토리) -->
    <section id="stepSection3" class="view-section"></section>

    <!-- Step 4: 재난 배틀 시뮬레이션 (위기 극복 레이드) -->
    <section id="stepSection4" class="view-section"></section>

    <!-- Step 5: 최종 탈출 결과 & 건강권(AAAQ) 배움 정리 -->
    <section id="stepSection5" class="view-section"></section>
  </main>

  <!-- Sound & Application Logic -->
  <script src="js/app.js"></script>
</body>
</html>
